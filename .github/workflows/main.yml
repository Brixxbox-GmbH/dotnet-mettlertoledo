# Action Name
name: Main Automated Builds

# When the Action will Run
on:
  push:
    branches:
      - master
    tags:
      - '*.*.*'
  pull_request:

permissions:
  contents: read

env:
  PROJECT: RICADO.MettlerToledo/RICADO.MettlerToledo.csproj
  BB_NUGET_URL: https://pkgs.dev.azure.com/brixxbox/_packaging/BB-NuGet/nuget/v3/index.json
  # Tag (z.B. 2.0.1) = Paketversion, sonst Dummy-Version fuer CI-Builds
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-ci' }}

# Workflow Jobs
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "$PROJECT" -c Release -p:Version=$VERSION

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -o out -p:Version=$VERSION

      - name: Publish to BB-NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          BB_NUGET_PAT: ${{ secrets.BB_NUGET_PAT }}
        run: |
          dotnet nuget add source "$BB_NUGET_URL" --name BB-NuGet \
            --username "github-actions" --password "$BB_NUGET_PAT" --store-password-in-clear-text
          # Azure Artifacts nimmt keine .snupkg an -> Symbole werden nicht mitveroeffentlicht
          dotnet nuget push "out/*.nupkg" --source BB-NuGet --api-key az --no-symbols
